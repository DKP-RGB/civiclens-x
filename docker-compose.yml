# CivicLens X - local container stack
#
# Phase 2 ships the frontend only. The FastAPI backend service is added in
# Phase 3 once its endpoints exist; wiring an empty service now would be
# misleading. The frontend still reads VITE_API_BASE_URL and will pick up the
# backend as soon as it is available.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080/

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Use the host-reachable backend URL once the API exists.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    image: civiclens-x-frontend:dev
    ports:
      - "8080:80"
    restart: unless-stopped
